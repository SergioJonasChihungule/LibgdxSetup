[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
eclipse.project.name = appName + '-core'

dependencies {
  api "com.badlogicgames.gdx:gdx:1.14.2"
  api "org.jetbrains.kotlin:kotlin-stdlib:2.4.20"
  implementation "com.badlogicgames.gdx:gdx-freetype:1.14.2"

  if(enableGraalNative == 'true') {
    implementation "io.github.berstanio:gdx-svmhelper-annotations:2.0.1"
  }
}
